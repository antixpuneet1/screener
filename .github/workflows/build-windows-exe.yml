name: Build Windows executable

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The packaging script downloads the official Windows node.exe and injects the
      # bundled app into it, so the Windows build runs fine on a Linux runner.
      - name: Package Windows executable
        run: npm run package:win

      # Artifact name carries the commit so a freshly downloaded build is never
      # confusable with an older one sitting in the same Downloads folder.
      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: fno-ol-screener-windows-${{ github.sha }}
          path: release/
          if-no-files-found: error

  smoke-test-windows:
    name: Smoke-test .exe on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fno-ol-screener-windows-${{ github.sha }}
          path: release

      # Runs the real executable against the mock provider (no credentials needed) and
      # asserts it serves the dashboard and completes a scan cycle. This is the check
      # that the .exe actually starts and works on Windows, not just that it builds.
      - name: Run the executable and verify it serves a scan cycle
        shell: pwsh
        run: |
          $env:DATA_PROVIDER = "mock"
          $env:IGNORE_MARKET_HOURS = "true"
          $env:REFRESH_INTERVAL_MS = "5000"
          $env:OPEN_BROWSER = "false"
          $env:PORT = "4999"

          # The executable name carries the build id, so resolve it rather than hardcoding.
          $exe = Get-ChildItem -Path release -Filter "fno-ol-screener-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No fno-ol-screener-*.exe found in the release folder" }
          Write-Host "Testing $($exe.Name)"

          $proc = Start-Process -FilePath $exe.FullName `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput screener-out.log `
            -RedirectStandardError screener-err.log

          try {
            $status = $null
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $candidate = Invoke-RestMethod -Uri "http://localhost:4999/api/status" -TimeoutSec 5
                if ($candidate.lastResult -and $candidate.lastResult.scannedContracts -gt 0) {
                  $status = $candidate
                  break
                }
              } catch {
                # server not up yet, or no cycle completed yet - keep polling
              }
            }

            if (-not $status) { throw "Executable never served a completed scan cycle" }

            Write-Host "provider=$($status.provider) scanned=$($status.lastResult.scannedContracts) hits=$($status.lastResult.hits.Count)"

            if ($status.provider -ne "mock") { throw "Unexpected provider: $($status.provider)" }
            if ($status.lastResult.errors.Count -gt 0) { throw "Scan reported errors: $($status.lastResult.errors -join '; ')" }

            # The dashboard's static assets must resolve from the public/ folder shipped
            # beside the .exe - a packaging regression would show up here as a 404.
            foreach ($asset in @("/", "/app.js", "/styles.css")) {
              $res = Invoke-WebRequest -Uri "http://localhost:4999$asset" -TimeoutSec 5
              if ($res.StatusCode -ne 200) { throw "Asset $asset returned $($res.StatusCode)" }
            }

            Write-Host "Windows executable smoke test passed."
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Write-Host "--- stdout ---"
            if (Test-Path screener-out.log) { Get-Content screener-out.log }
            Write-Host "--- stderr ---"
            if (Test-Path screener-err.log) { Get-Content screener-err.log }
          }

  release:
    name: Attach .exe to release
    needs: smoke-test-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fno-ol-screener-windows-${{ github.sha }}
          path: release

      - name: Zip the release folder
        run: cd release && zip -r ../fno-ol-screener-windows.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: fno-ol-screener-windows.zip
